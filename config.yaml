# Konfiguration des Verfügbarkeits-Trackers. Anpassbar ohne Code-Änderung.
#
# Die Watchlist (products) kann beliebig viele Geräte enthalten – jeder
# Eintrag bringt seine eigenen Shop-URLs mit. Die globalen Blöcke
# (location, sources) gelten für alle Produkte.

products:
  - name: "Midea PortaSplit 12.000 BTU"
    # Strikter Anker, damit nie das falsche/zu teure Gerät matcht.
    # Bestätigte EAN der gesuchten Midea PortaSplit 12.000 BTU.
    eans:
      - "4048164116478"

    # Fallback-Titelabgleich, falls eine Quelle keine EAN liefert.
    title_must_include:
      - "portasplit"

    # Wichtig: "cool" ausschließen, damit die kleinere PortaSplit Cool
    # nicht versehentlich als 12.000-BTU-Modell gemeldet wird.
    title_must_exclude:
      - "cool"

    # Preisgrenze für die normale 12.000-BTU-Version.
    max_price: 999.0

    # Empfehlung: false = nur Neuware.
    # Wenn Amazon Warehouse / gebrauchte Artikel okay sind, auf true ändern.
    allow_used: false

    # Pro Quelle die direkte Produkt-URL. Leere Werte = Quelle wird übersprungen.
    urls:
      geizhals: "https://geizhals.de/midea-comfee-portasplit-v233573.html"
      idealo: "https://www.idealo.de/preisvergleich/OffersOfProduct/204374464_-portasplit-3-5-kw-midea.html"
      mediamarkt: "https://www.mediamarkt.de/de/product/_midea-porta-split-klimaanlage-grau-max-raumgrosse-42-m-eek-a-142245268.html"
      saturn: "https://www.saturn.de/de/product/_midea-porta-split-klimaanlage-grau-max-raumgrosse-42-m-eek-a-142245268.html"
      obi: "https://www.obi.de/p/8620890/midea-mobile-split-klimaanlage-portasplit"
      bauhaus: "https://www.bauhaus.info/klimaanlagen/midea-klimasplitgeraet-portasplit-12000-btu/p/31934233"
      hornbach: "https://www.hornbach.de/p/klimasplitgeraet-midea-portasplit-12-000-btu-105-m-weiss/12356554/"
      amazon: "https://www.amazon.de/dp/B0D3PP64JS"

  - name: "Midea PortaSplit Cool 8.000 BTU"
    # EAN der kleineren PortaSplit Cool 8.000 BTU / ca. 2,35 kW.
    eans:
      - "4048164122301"

    # Hier muss zusätzlich "cool" im Titel vorkommen.
    title_must_include:
      - "portasplit"
      - "cool"

    title_must_exclude: []

    # Preisgrenze für die kleinere Cool-Version.
    max_price: 799.0

    # Empfehlung: nur Neuware.
    allow_used: false

    urls:
      geizhals: ""
      idealo: "https://www.idealo.de/preisvergleich/OffersOfProduct/210261557_-portasplit-cool-2-35kw-midea.html"
      mediamarkt: "https://www.mediamarkt.de/de/product/_midea-portasplit-cool-mobile-split-klimaanlage-8000btu-mobile-split-klimaanlage-weiss-max-raumgrosse-28-m-eek-a-179209322.html"
      saturn: "https://www.saturn.de/de/product/_midea-portasplit-cool-split-klimaanlage-weissgrau-max-raumgrosse-70-m-3035466.html"
      obi: "https://www.obi.de/p/2191158911022/midea-split-klimaanlage-portasplit-cool-mobil-weissgrau"
      bauhaus: ""
      hornbach: ""
      amazon: ""

location:
  postal_code: "63533"
  city: "Mainhausen"
  latitude: 50.0167
  longitude: 8.9833
  radius_km: 50  # Umkreis für Filial-Verfügbarkeit

# Quellen ein-/ausschalten. Schlüssel entsprechen den Adapter-Namen.
sources:
  geizhals: true
  idealo: true
  mediamarkt: true
  saturn: true
  obi: true
  bauhaus: true
  hornbach: true
  amazon: true

# Tägliche "lebt noch"-Statusmeldung via Telegram.
# hour_utc: 6 entspricht ca. 8 Uhr deutscher Sommerzeit.
heartbeat:
  enabled: true
  hour_utc: 6
