name: Midea PortaSplit Verfügbarkeit

on:
  schedule:
    # Alle 10 Minuten, aber bewusst versetzt.
    # Läuft bei :03, :13, :23, :33, :43, :53.
    # Das reduziert GitHub-Lastspitzen gegenüber :00/:10/:20.
    - cron: "3-59/10 * * * *"

  # Manueller Start über GitHub Actions → Run workflow
  workflow_dispatch: {}

# Erlaubt dem Workflow, state.json zurück ins Repository zu committen.
permissions:
  contents: write

concurrency:
  group: midea-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Chromium für Browser-Fallback installieren
        run: python -m playwright install --with-deps chromium

      - name: Verfügbarkeit prüfen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m tracker.run

      - name: State zurück committen
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git add state.json
            git commit -m "chore: update availability state [skip ci]"

            # Vor dem Push den aktuellen Branch-Stand holen.
            # Verhindert Fehler wie: rejected / fetch first.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          else
            echo "Kein State-Update."
          fi
